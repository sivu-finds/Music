
name: Build Sivu's Isaiaruvi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || { echo "Project ZIP not found"; exit 1; }
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR" || { echo "Gradle project not found"; exit 1; }
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sivus-Isaiaruvi-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
