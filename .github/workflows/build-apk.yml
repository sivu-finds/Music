name: Build Sivu's Isaiaruvi APK

on: workflow_dispatch: push: branches: - main paths: - '**.zip' - '.github/workflows/build-apk.yml'

permissions: contents: read

jobs: build: runs-on: ubuntu-latest

steps: - name: Checkout repository uses: actions/checkout@v4 - name: Set up Java uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Locate project ZIP id: locate shell: bash run: | ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -n 1) if [ -z "$ZIP_FILE" ]; then echo "ERROR: No project ZIP found in the repository root." exit 1 fi mkdir -p "$RUNNER_TEMP/isaiaruvi" unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/isaiaruvi" PROJECT_DIR=$(find "$RUNNER_TEMP/isaiaruvi" -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname) if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR=$(find "$RUNNER_TEMP/isaiaruvi" -type f -name gradlew | head -n 1 | xargs -r dirname) fi if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR=$(find "$RUNNER_TEMP/isaiaruvi" -type f -name build.gradle -o -name build.gradle.kts | head -n 1 | xargs -r dirname) fi if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then echo "ERROR: Could not locate the Android project with an app directory." find "$RUNNER_TEMP/isaiaruvi" -maxdepth 5 -type f | head -n 100 exit 1 fi echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV" echo "Project located at: $PROJECT_DIR" - name: Show Kotlin source around errors shell: bash run: | SOURCE="$PROJECT_DIR/app/src/main/java/com/melo/localmusic/MainActivity.kt" if [ -f "$SOURCE" ]; then nl -ba "$SOURCE" | sed -n '75,125p' else echo "MainActivity.kt not found at expected path." find "$PROJECT_DIR/app/src/main" -name MainActivity.kt fi - name: Set up Gradle uses: gradle/actions/setup-gradle@v4 - name: Build APK shell: bash run: | cd "$PROJECT_DIR" if [ -f ./gradlew ]; then chmod +x ./gradlew ./gradlew assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=warning else gradle assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=warning fi - name: Upload APK if: success() uses: actions/upload-artifact@v4 with: name: Sivus-Isaiaruvi-APK path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk if-no-files-found: error 
