
name: Build Sivu's Isaiaruvi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || { echo "ZIP not found"; exit 1; }
          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Configure Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("project").rglob("*"):
              if not p.is_file():
                  continue
              if p.name not in ("build.gradle", "build.gradle.kts"):
                  continue

              s = p.read_text()
              original = s

              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = s.replace(
                  "VERSION_1_8",
                  "VERSION_17"
              )
              s = s.replace(
                  'sourceCompatibility = "1.8"',
                  'sourceCompatibility = "17"'
              )
              s = s.replace(
                  'targetCompatibility = "1.8"',
                  'targetCompatibility = "17"'
              )
              s = s.replace(
                  "jvmTarget = \"1.8\"",
                  "jvmTarget = \"17\""
              )
              s = s.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              if s != original:
                  p.write_text(s)
                  print("Updated:", p)

          PY

      - name: Locate project
        run: |
          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)
          test -n "$SETTINGS" || { echo "Gradle settings not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon \
            -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sivus-Isaiaruvi-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
